name: First ten minutes playtest
description: Share a real first session of Recoil Foundry. Reports are public.
title: '[Playtest] '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Recoil Foundry! Fill this in after playing, not during your run.
        [Play free on itch.io](https://caleb-guyer.itch.io/recoil-foundry).
        You can also paste feedback into the [itch.io playtest discussion](https://itch.io/t/7174290/recoil-foundry-free-browser-does-recoil-movement-make-sense-in-the-first-ten-minutes) instead.
        No names, email addresses, recordings or private files are needed.
  - type: input
    id: first-time
    attributes:
      label: Is this your first time playing Recoil Foundry?
      placeholder: First time / returning player
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Version, browser and time played
      description: Find the current version in About or the in-game run summary. Approximate session time is fine. Mention if this run was continued from a save.
      placeholder: 'Version from About; Chrome on Windows; keyboard and mouse; about 10 minutes; room 3'
  - type: dropdown
    id: exposure
    attributes:
      label: What did you see before playing?
      options:
        - Only the normal store page
        - Watched the trailer or other gameplay
        - Read controls or a guide
        - Someone explained or demonstrated the game
        - More than one of these
        - Not sure
  - type: textarea
    id: best-moment
    attributes:
      label: What was the best moment?
      placeholder: A specific moment, action or upgrade you enjoyed. No highlight is a useful answer too.
    validations:
      required: true
  - type: textarea
    id: first-friction
    attributes:
      label: What first felt confusing, unfair or frustrating?
      description: Tell us what happened and what you expected. Nothing confusing is a useful answer too.
    validations:
      required: true
  - type: input
    id: restart
    attributes:
      label: What actually happened after your first death?
      description: Say what actually happened; no death before stopping is a valid answer.
      placeholder: Restarted / tried but could not / stopped / did not die / another ending
    validations:
      required: true
  - type: textarea
    id: another-run
    attributes:
      label: Did you want another run, and why?
      description: Your honest reason for continuing or stopping matters more than a score.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Optional run details or extra notes
      description: Feedback after a run, or Pause → Report an issue → Playtest, supplies an editable summary with version, active run time, room, starting gun, upgrades and seed. Active run time includes earlier play before Continue and excludes pauses. Copy and review before posting; screenshots are optional.
