name: Package browser release candidate
on:
  push:
    tags: ['v*-rc.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate candidate and prepare notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > candidate-notes.md
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package static site
        working-directory: dist
        run: zip -qr "../recoil-foundry-$RELEASE_TAG-site.zip" .
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          "recoil-foundry-$RELEASE_TAG-site.zip"
          --verify-tag --prerelease
          --title "Recoil Foundry $RELEASE_TAG"
          --notes-file candidate-notes.md
