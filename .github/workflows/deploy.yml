name: Build and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  regression-shards:
    name: Regular regression tests (${{ matrix.shard }} / 4)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RF_REGRESSION_SHARD: ${{ matrix.shard }}
      RF_REGRESSION_SHARDS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
  regression:
    name: Regular regression tests
    needs: regression-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every regular-test shard to pass
        env:
          RF_REGRESSION_RESULT: ${{ needs.regression-shards.result }}
        run: test "$RF_REGRESSION_RESULT" = success
  max-combos:
    name: Maximal builds (${{ matrix.shard }} / 8)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      RF_MAX_COMBO_SHARD: ${{ matrix.shard }}
      RF_MAX_COMBO_SHARDS: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:max-combos
  build:
    needs: [regression, max-combos]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
